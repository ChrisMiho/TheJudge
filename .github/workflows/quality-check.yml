name: Quality Check

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

# Supersede in-flight PR runs, but never cancel a push run: cancelling a `main`
# run would abort the deploy job mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record runner cores
        run: nproc

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Script tests
        run: npm run test:scripts

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend tests with coverage
        run: npm --workspace apps/backend run test:coverage

  frontend:
    name: frontend-shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Thresholds are deliberately disabled here and applied only in
      # coverage-merge: a shard sees a fraction of the suite, so judging it
      # against the whole-suite threshold fails on partial data, not on a real
      # coverage regression. The config values themselves are untouched.
      - name: Frontend tests with coverage (shard ${{ matrix.shard }}/3)
        working-directory: apps/frontend
        run: >-
          npx vitest run --coverage --coverage.thresholds.lines=0
          --reporter=blob --shard=${{ matrix.shard }}/3

      - name: Upload shard blob report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-blob-${{ matrix.shard }}
          path: apps/frontend/.vitest-reports/
          retention-days: 1
          if-no-files-found: error
          # `.vitest-reports` is a dotted directory, which the action's glob
          # skips by default — without this the upload silently finds nothing.
          include-hidden-files: true

  coverage-merge:
    name: coverage-merge
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-blob-*
          path: apps/frontend/.vitest-reports/
          merge-multiple: true

      # The only job that can fail on coverage: thresholds come from
      # vite.config.ts and are evaluated once, against merged totals.
      - name: Merge shard reports and apply thresholds
        working-directory: apps/frontend
        run: npx vitest run --merge-reports --coverage

  changes:
    name: changes
    # Only computed where it can matter: a push to main (the normal deploy
    # trigger) or a manual workflow_dispatch (which always deploys, per
    # requirement, so it does not need the path check). Never on pull_request
    # — deploy never runs there regardless (DEC-084's OIDC credential scoping
    # is unchanged), so there is nothing for this job to gate.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the merge-base diff below needs to reach arbitrarily
          # far back, not just the immediately preceding commit.
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual workflow_dispatch trigger — deploying regardless of changed paths." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"

          # Fail safe to deploy whenever the changed-file set cannot be
          # determined: the workflow's first-ever run on this branch, an
          # all-zeros before-SHA, or a before commit this checkout cannot see.
          if [[ -z "$before" ]] || [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "Base commit for change detection is unavailable (before=\"$before\") — failing safe to deploy." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          echo "## Change-detection: paths in this push" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$changed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Changed paths:"
          echo "$changed"

          # The code set: a change under any of these is what the deploy job
          # exists to ship. Everything else (docs, PRD/**, .claude/**, ...)
          # does not warrant a full frontend + Lambda deploy.
          code_pattern='^(apps/|scripts/|\.github/workflows/|package\.json$|package-lock\.json$|tsconfig.*\.json$)'
          if echo "$changed" | grep -Eq "$code_pattern"; then
            echo "Code-set path changed — deploy verdict: deploy." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No code-set path changed — deploy verdict: skip." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: deploy
    needs: [static, backend, coverage-merge, changes]
    if: >-
      needs.changes.outputs.deploy == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Job-scoped so pull_request jobs running contributor-controlled refs never
    # receive AWS-assumable credentials.
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: thejudge-web-${{ vars.AWS_ACCOUNT_ID }}
      AWS_LAMBDA_FUNCTION_NAME: thejudge-api
      AWS_CLOUDFRONT_COMMENT: thejudge-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/thejudge-github-deploy
          aws-region: us-east-1

      # aws-deploy.sh runs its own frontend build, so the value must reach that
      # step (commit f7970bf scoped it here to keep it out of PR-run scope).
      - name: Deploy
        run: bash scripts/aws-deploy.sh
        env:
          VITE_FEEDBACK_FORMSPREE_ID: ${{ vars.VITE_FEEDBACK_FORMSPREE_ID }}
